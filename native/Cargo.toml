[package]
name = "tailwind-canonical-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[[bin]]
name = "twcanon"
path = "src/cli/main.rs"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
icu_collator = "2"
icu_locale_core = "2"
regex = "1"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = { path = "vendor/regress/regress-0.12.0", features = ["utf16", "prohibit-unsafe", "external-bytecode"] }

oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
compact_str = { version = "=0.10.0", features = ["serde"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
